name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 package.json 的 packageManager 字段读取
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify translations and interpolation parameters
        run: node scripts/verify-i18n-completeness.mjs

      - name: Verify README app table and package metadata
        run: node scripts/verify-docs-apps.mjs

      - name: Unit tests
        run: pnpm test

      - name: Release tooling regression tests
        run: pnpm test:release

      - name: Next.js build
        run: pnpm build

      - name: Restore committed extension build time
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const { readFileSync } = require('node:fs')
          const version = JSON.parse(readFileSync('version.json', 'utf8')).v
          const match = /\+(\d{12})$/.exec(String(version || ''))
          if (!match) {
            throw new Error('version.json must contain a +YYYYMMDDHHmm suffix')
          }
          const compact = match[1]
          console.log(`ST_STAGE_BUILD_TIME=${compact.slice(0, 4)}-${compact.slice(4, 6)}-${compact.slice(6, 8)} ${compact.slice(8, 10)}:${compact.slice(10, 12)}`)
          NODE

      - name: Verify required install assets are committed
        run: >-
          git ls-files --error-unmatch
          manifest.json index.js bundle.js style.css version.json
          locales/zh-CN.json locales/en-US.json
          st-distribution/manifest.json st-distribution/index.js st-distribution/bundle.js
          st-distribution/style.css st-distribution/version.json st-distribution/README.md
          st-distribution/locales/zh-CN.json st-distribution/locales/en-US.json

      - name: Build both extension destinations with the committed timestamp
        run: pnpm build:all

      - name: Verify runtime and locale parity
        run: node scripts/verify-runtime-parity.mjs --root . --distribution st-distribution --preview public

      - name: Report extension bundle size
        run: |
          node - <<'NODE'
          const bytes = require('node:fs').statSync('bundle.js').size
          console.log(`bundle.js: ${bytes} bytes`)
          if (bytes >= 1000000) throw new Error(`::warning::bundle.js exceeds 1 MB (${bytes} bytes)`)
          NODE

      - name: Verify committed extension artifacts
        run: node scripts/verify-runtime-parity.mjs --root . --distribution st-distribution --preview public --committed
