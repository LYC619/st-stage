name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 package.json 的 packageManager 字段读取
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Next.js build
        run: pnpm build

      - name: Restore committed extension build time
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const { readFileSync } = require('node:fs')
          const version = JSON.parse(readFileSync('version.json', 'utf8')).v
          const match = /\+(\d{12})$/.exec(String(version || ''))
          if (!match) {
            throw new Error('version.json must contain a +YYYYMMDDHHmm suffix')
          }
          const compact = match[1]
          console.log(`ST_STAGE_BUILD_TIME=${compact.slice(0, 4)}-${compact.slice(4, 6)}-${compact.slice(6, 8)} ${compact.slice(8, 10)}:${compact.slice(10, 12)}`)
          NODE

      - name: Extension build
        run: pnpm build:ext

      - name: Verify committed extension artifacts
        run: git diff --exit-code -- index.js bundle.js style.css version.json
